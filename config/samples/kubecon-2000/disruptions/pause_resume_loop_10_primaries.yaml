apiVersion: valkey.io/v1alpha1
kind: ValkeyDisruption
metadata:
  name: kubecon-loop-10-primaries
  namespace: valkey-kubecon
spec:
  clusterRef: kubecon-2000
  action: PauseResumeLoop
  selector:
    role: primary
    shardRange:
      start: 100
      end: 109
    count: 10
  loop:
    repeat: 5
    intervalSec: 120
