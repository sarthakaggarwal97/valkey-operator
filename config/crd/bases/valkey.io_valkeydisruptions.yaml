---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: valkeydisruptions.valkey.io
spec:
  group: valkey.io
  names:
    kind: ValkeyDisruption
    listKind: ValkeyDisruptionList
    plural: valkeydisruptions
    shortNames:
    - vkd
    singular: valkeydisruption
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Disruption action type
      jsonPath: .spec.action
      name: Action
      type: string
    - description: Current execution phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Number of targeted nodes
      jsonPath: .status.targetCount
      name: Targets
      type: integer
    - description: Number of completed nodes
      jsonPath: .status.completedCount
      name: Completed
      type: integer
    - description: Time since creation
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ValkeyDisruption is the Schema for the valkeydisruptions API.
          It provides a declarative API for fault injection against Valkey clusters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired disruption action
            properties:
              action:
                allOf:
                - enum:
                  - PauseProcess
                  - ResumeProcess
                  - KillProcess
                  - Failover
                  - DeletePod
                  - PauseResumeLoop
                - enum:
                  - PauseProcess
                  - ResumeProcess
                  - KillProcess
                  - Failover
                  - DeletePod
                  - PauseResumeLoop
                description: Action is the disruption type to perform.
                type: string
              clusterRef:
                description: ClusterRef is the name of the ValkeyCluster to disrupt.
                type: string
              loop:
                description: |-
                  Loop configures automated pause→wait→resume→wait cycles.
                  Only applies to PauseResumeLoop action.
                properties:
                  intervalSec:
                    default: 120
                    description: |-
                      IntervalSec is the wait duration (in seconds) between pause and resume,
                      and between resume and the next pause. Mirrors the toolkit's 2-minute default.
                    format: int32
                    maximum: 600
                    minimum: 1
                    type: integer
                  repeat:
                    default: 1
                    description: Repeat is the number of pause-resume cycles to execute.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                required:
                - intervalSec
                - repeat
                type: object
              pauseTimeoutSec:
                default: 30
                description: |-
                  PauseTimeoutSec is the maximum duration to keep a process paused (SIGSTOP).
                  After this timeout, the controller automatically sends SIGCONT as a safety net.
                  Only applies to PauseProcess action.
                format: int32
                maximum: 600
                minimum: 1
                type: integer
              selector:
                description: Selector determines which nodes are targeted.
                properties:
                  count:
                    description: |-
                      Count is the number of nodes to target. 0 means all matching nodes
                      (requires valkey.io/confirm-destructive: "true" annotation).
                    format: int32
                    minimum: 0
                    type: integer
                  role:
                    description: |-
                      Role filters by node role: "primary" or "replica".
                      When omitted (empty), matches all roles.
                    enum:
                    - primary
                    - replica
                    type: string
                  shardRange:
                    description: ShardRange targets shards in [start, end] inclusive.
                    properties:
                      end:
                        description: |-
                          End is the last shard index in the range (inclusive).
                          Must be >= Start.
                        format: int32
                        minimum: 0
                        type: integer
                      start:
                        description: Start is the first shard index in the range (inclusive).
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - end
                    - start
                    type: object
                  zone:
                    description: Zone filters by topology.kubernetes.io/zone label.
                    type: string
                type: object
            required:
            - action
            - clusterRef
            - selector
            type: object
          status:
            default:
              phase: Pending
            description: status defines the observed state of the disruption
            properties:
              completedCount:
                description: CompletedCount is the number of nodes where the action
                  succeeded.
                format: int32
                type: integer
              completionTime:
                description: CompletionTime is when execution finished.
                format: date-time
                type: string
              conditions:
                description: Conditions for standard status reporting.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failedNodes:
                description: FailedNodes lists nodes where the action failed with
                  reasons.
                items:
                  description: FailedNode records a node where a disruption action
                    failed.
                  properties:
                    address:
                      description: Address is the address of the failed node.
                      type: string
                    reason:
                      description: Reason describes why the action failed (e.g., "no-synced-replica",
                        "unreachable").
                      type: string
                  required:
                  - address
                  - reason
                  type: object
                type: array
              loopProgress:
                description: LoopProgress tracks PauseResumeLoop iteration progress.
                properties:
                  currentIteration:
                    description: CurrentIteration is the loop iteration currently
                      executing (1-indexed).
                    format: int32
                    type: integer
                  currentPhase:
                    description: |-
                      CurrentPhase is what the loop is currently doing.
                      State transitions: Pausing → WaitingAfterPause → Resuming → WaitingAfterResume → (next iteration or complete)
                    enum:
                    - Pausing
                    - WaitingAfterPause
                    - Resuming
                    - WaitingAfterResume
                    type: string
                  originalLivenessThresholds:
                    additionalProperties:
                      format: int32
                      type: integer
                    description: |-
                      OriginalLivenessThresholds stores the original liveness probe failureThreshold
                      per Deployment name, before it was increased. Used to restore original values
                      after loop completion or CR deletion.
                    type: object
                  totalIterations:
                    description: TotalIterations is the total number of iterations
                      configured.
                    format: int32
                    type: integer
                required:
                - currentIteration
                - currentPhase
                - totalIterations
                type: object
              phase:
                allOf:
                - enum:
                  - Pending
                  - Executing
                  - Completed
                  - Failed
                - enum:
                  - Pending
                  - Executing
                  - Completed
                  - Failed
                description: Phase is the current execution phase.
                type: string
              startTime:
                description: StartTime is when execution began.
                format: date-time
                type: string
              targetCount:
                description: TargetCount is the number of nodes selected for disruption.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
